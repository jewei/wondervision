name: verify

on:
  pull_request:
  push:
    branches: [work]
  workflow_dispatch:
    inputs:
      performance:
        description: Also run the spec §9 performance measurement (about 25 minutes)
        type: boolean
        default: false
      idle_seconds:
        description: Seconds per idle phase (the spec uses 600)
        default: '600'
      soak_hours:
        description: Also run an idle soak for this many hours (0 = off; at most 5.5 on hosted runners)
        default: '0'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go checks and headless verifiers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache TLC
        uses: actions/cache@v4
        with:
          path: build/tools
          key: tlc-1.8.0

      - name: go vet
        run: go vet ./...

      - name: go test -race (includes internal/guardrails)
        run: go test -race ./...

      - name: mygo vet
        run: go tool mygo vet

      - name: Build production and e2e binaries
        run: |
          go build -tags mygo_noinspector -trimpath -o build/wondervision ./cmd/wondervision
          go build -tags e2e -o build/wondervision-e2e ./cmd/wondervision

      - name: Linux packages depend on GTK only
        run: |
          go tool mygo build -platform linux/amd64 -skip-installer -o build/dist
          depends=$(dpkg-deb -f build/dist/linux-amd64/wondervision_*_amd64.deb Depends)
          echo "Depends: $depends"
          # The app shows no web pages (mygo.json linux.webview: false); the
          # package must not pull in WebKitGTK.
          test "$depends" = "libgtk-3-0 | libgtk-3-0t64"

      - name: Request ordering (with mutation check)
        run: python3 scripts/verify_request_order.py --mutation-check

      - name: Recovery lock (with mutation check)
        run: python3 scripts/verify_recovery.py

      - name: Save protocol model (TLC)
        run: python3 scripts/verify_save_model.py

      - name: Recovery protocol model (TLC)
        run: python3 scripts/verify_recovery_model.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-checks
          path: build/verification/
          if-no-files-found: ignore

  cross:
    name: Build and vet for macOS, Windows and Linux arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [darwin/amd64, darwin/arm64, windows/amd64, windows/arm64, linux/arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Compile-only: these platforms are not run or tested here. go vet also
      # type-checks the test files for the target.
      - name: Build and vet ${{ matrix.target }}
        env:
          CGO_ENABLED: '0'
          TARGET: ${{ matrix.target }}
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/}
          go build -tags mygo_noinspector -trimpath -o /dev/null ./cmd/wondervision
          go build -tags e2e -o /dev/null ./cmd/wondervision
          go vet ./...
        shell: bash

  native:
    name: Native GUI verifiers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GTK and a headless desktop
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgtk-3-0t64 libx11-6 libxtst6 x11-utils xvfb openbox at-spi2-core dbus-x11

      - name: Build e2e binary
        run: go build -tags e2e -o build/wondervision-e2e ./cmd/wondervision

      # The drivers need a window manager: without one, GTK dialogs and Alt+F4
      # do not behave as on a desktop and the quit-guard checks time out.
      - name: verify_native.py
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- bash -c '
            openbox >/dev/null 2>&1 & wm=$!
            for i in $(seq 50); do xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q window && break; sleep 0.1; done
            python3 scripts/verify_native.py run --out build/verification/native; rc=$?
            kill $wm; exit $rc'

      - name: verify_editing.py
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- bash -c '
            openbox >/dev/null 2>&1 & wm=$!
            for i in $(seq 50); do xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q window && break; sleep 0.1; done
            python3 scripts/verify_editing.py --out build/verification/editing; rc=$?
            kill $wm; exit $rc'

      - name: verify_m3.py
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- bash -c '
            openbox >/dev/null 2>&1 & wm=$!
            for i in $(seq 50); do xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q window && break; sleep 0.1; done
            python3 scripts/verify_m3.py --out build/verification/m3; rc=$?
            kill $wm; exit $rc'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-native
          path: build/verification/
          if-no-files-found: ignore

  performance:
    name: Performance (spec §9)
    if: github.event_name == 'workflow_dispatch' && inputs.performance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GTK and a headless desktop
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgtk-3-0t64 libx11-6 libxtst6 x11-utils xvfb openbox at-spi2-core dbus-x11 imagemagick

      - name: Build production and e2e binaries
        run: |
          go build -tags mygo_noinspector -trimpath -o build/wondervision ./cmd/wondervision
          go build -tags e2e -o build/wondervision-e2e ./cmd/wondervision

      - name: measure_performance.py
        env:
          IDLE_SECONDS: ${{ inputs.idle_seconds }}
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- bash -c '
            openbox >/dev/null 2>&1 & wm=$!
            for i in $(seq 50); do xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q window && break; sleep 0.1; done
            python3 scripts/measure_performance.py --out build/verification/performance --idle-seconds "$IDLE_SECONDS"; rc=$?
            kill $wm; exit $rc'
          cat build/verification/performance/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance
          path: build/verification/performance/
          if-no-files-found: ignore

  soak:
    name: Idle soak (spec §9)
    if: github.event_name == 'workflow_dispatch' && inputs.soak_hours != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install GTK and a headless desktop
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgtk-3-0t64 libx11-6 libxtst6 x11-utils xvfb openbox at-spi2-core dbus-x11 imagemagick

      - name: Build production binary
        run: go build -tags mygo_noinspector -trimpath -o build/wondervision ./cmd/wondervision

      - name: soak.py
        env:
          SOAK_HOURS: ${{ inputs.soak_hours }}
        run: |
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- bash -c '
            openbox >/dev/null 2>&1 & wm=$!
            for i in $(seq 50); do xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q window && break; sleep 0.1; done
            python3 scripts/soak.py run --out build/verification/soak --hours "$SOAK_HOURS" --interval 300; rc=$?
            kill $wm; exit $rc'
          cat build/verification/soak/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak
          path: build/verification/soak/
          if-no-files-found: ignore
