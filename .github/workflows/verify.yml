name: verify

# Linux checks run on a pull request and again when it merges. macOS tests and
# the other-OS builds run on a push to the default branch, on a manual run, and
# on a pull request that changes platform-specific code. A manual run can also
# measure performance or soak. Markdown, docs, and the agent skills do not
# start a run. Push is limited to the default branch, so one feature-branch
# push does not start a second run beside the pull request.

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.gitignore'
      - 'LICENSE'
  push:
    # `work` is the default branch. `main` is unused; listing it keeps the
    # post-merge run if the default branch is renamed.
    branches: [work, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      performance:
        description: Also run the spec §9 performance measurement (about 25 minutes)
        type: boolean
        default: false
      idle_seconds:
        description: Seconds per idle phase (the spec uses 600)
        default: '600'
      soak_hours:
        description: Also run an idle soak for this many hours (0 = off; at most 5.5 on hosted runners)
        default: '0'

permissions:
  contents: read

# A push cancels the older run for the same branch. Manual runs (the
# performance measurement and the soak, which take hours) have a group of
# their own, so merging to the branch never cancels them.
concurrency:
  group: verify-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    name: Go checks and headless verifiers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache TLC
        uses: actions/cache@v6
        with:
          path: build/tools
          key: tlc-1.8.0

      - name: go vet
        run: go vet ./...

      - name: go test -race (includes internal/guardrails)
        run: go test -race ./...

      # macOS's temp folder is behind the /var symlink; reproduce that here so
      # path containment keeps comparing resolved paths.
      - name: go test with TMPDIR behind a symlink
        run: |
          mkdir -p "$RUNNER_TEMP/real" && ln -s "$RUNNER_TEMP/real" "$RUNNER_TEMP/link"
          TMPDIR="$RUNNER_TEMP/link" go test -count=1 ./...

      - name: mygo vet
        run: go tool mygo vet

      - name: Build production and e2e binaries
        run: |
          go build -tags mygo_noinspector -trimpath -o build/wondervision ./cmd/wondervision
          go build -tags e2e -o build/wondervision-e2e ./cmd/wondervision

      - name: Linux packages depend on GTK only
        run: |
          go tool mygo build -platform linux/amd64 -skip-installer -o build/dist
          depends=$(dpkg-deb -f build/dist/linux-amd64/wondervision_*_amd64.deb Depends)
          echo "Depends: $depends"
          # The app shows no web pages (mygo.json linux.webview: false); the
          # package must not pull in WebKitGTK.
          test "$depends" = "libgtk-3-0 | libgtk-3-0t64"

      - name: Request ordering (with mutation check)
        run: python3 scripts/verify_request_order.py --mutation-check

      - name: Recovery lock (with mutation check)
        run: python3 scripts/verify_recovery.py

      - name: Save protocol model (TLC)
        run: python3 scripts/verify_save_model.py

      - name: Recovery protocol model (TLC)
        run: python3 scripts/verify_recovery_model.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-checks
          path: build/verification/
          if-no-files-found: ignore

  # Decides whether a pull request pays for macOS and the other-OS builds.
  # Push and manual runs skip this job and run those builds anyway.
  platforms:
    name: Platform paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.set.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: set
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pattern='_(darwin|windows|arm64|amd64|unix|other|linux)\.go$|^(go\.mod|go\.sum|mygo\.json)$|^cmd/|^internal/workspace/rename|^internal/documents/recovery_lock|^\.github/workflows/'
          if ! changed=$(git diff --name-only --no-renames "$BASE" "$GITHUB_SHA"); then
            echo "Could not diff; running the platform jobs."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          if [ -n "$changed" ] && echo "$changed" | grep -qE "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  cross:
    name: Build and vet for macOS, Windows and Linux arm64
    needs: platforms
    # A skipped path-filter job (push or manual) must not block this one.
    # If the filter itself fails, still build: a fetch error is not a reason
    # to skip the other operating systems.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.platforms.result != 'success' || needs.platforms.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Compile-only: these platforms are not run or tested here. go vet also
      # type-checks the test files for the target. One job, so checkout and
      # the Go toolchain are not started five times.
      - name: Build and vet other targets
        env:
          CGO_ENABLED: '0'
        run: |
          set -uo pipefail
          fail=0
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 linux/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            export GOOS GOARCH
            echo "=== $target ==="
            go build -tags mygo_noinspector -trimpath -o /dev/null ./cmd/wondervision || fail=1
            go build -tags e2e -o /dev/null ./cmd/wondervision || fail=1
            go vet ./... || fail=1
          done
          exit "$fail"

  macos:
    name: Go tests on macOS
    needs: platforms
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.platforms.result != 'success' || needs.platforms.outputs.run == 'true') }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Headless (ui.Tester); the native window is checked by hand on a Mac.
      - name: go vet and go test -race
        run: |
          go vet ./...
          go test -race ./...

  native:
    name: Native GUI verifiers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GTK and a headless desktop
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgtk-3-0t64 libx11-6 libxtst6 x11-utils xvfb openbox at-spi2-core dbus-x11

      - name: Build e2e binary
        run: go build -tags e2e -o build/wondervision-e2e ./cmd/wondervision

      # The drivers need a window manager: without one, GTK dialogs and Alt+F4
      # do not behave as on a desktop and the quit-guard checks time out.
      - name: verify_native.py
        run: |
          # shellcheck disable=SC2016 # the inner bash expands $wm, $rc, and the env vars
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- bash -c '
            openbox >/dev/null 2>&1 & wm=$!
            for i in $(seq 50); do xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q window && break; sleep 0.1; done
            python3 scripts/verify_native.py run --out build/verification/native; rc=$?
            kill $wm; exit $rc'

      - name: verify_editing.py
        run: |
          # shellcheck disable=SC2016 # the inner bash expands $wm, $rc, and the env vars
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- bash -c '
            openbox >/dev/null 2>&1 & wm=$!
            for i in $(seq 50); do xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q window && break; sleep 0.1; done
            python3 scripts/verify_editing.py --out build/verification/editing; rc=$?
            kill $wm; exit $rc'

      - name: verify_m3.py
        run: |
          # shellcheck disable=SC2016 # the inner bash expands $wm, $rc, and the env vars
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- bash -c '
            openbox >/dev/null 2>&1 & wm=$!
            for i in $(seq 50); do xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q window && break; sleep 0.1; done
            python3 scripts/verify_m3.py --out build/verification/m3; rc=$?
            kill $wm; exit $rc'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-native
          path: build/verification/
          if-no-files-found: ignore

  performance:
    name: Performance (spec §9)
    if: github.event_name == 'workflow_dispatch' && inputs.performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GTK and a headless desktop
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgtk-3-0t64 libx11-6 libxtst6 x11-utils xvfb openbox at-spi2-core dbus-x11 imagemagick

      - name: Build production and e2e binaries
        run: |
          go build -tags mygo_noinspector -trimpath -o build/wondervision ./cmd/wondervision
          go build -tags e2e -o build/wondervision-e2e ./cmd/wondervision

      - name: measure_performance.py
        env:
          IDLE_SECONDS: ${{ inputs.idle_seconds }}
        run: |
          # shellcheck disable=SC2016 # the inner bash expands $wm, $rc, and the env vars
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- bash -c '
            openbox >/dev/null 2>&1 & wm=$!
            for i in $(seq 50); do xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q window && break; sleep 0.1; done
            python3 scripts/measure_performance.py --out build/verification/performance --idle-seconds "$IDLE_SECONDS"; rc=$?
            kill $wm; exit $rc'
          cat build/verification/performance/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance
          path: build/verification/performance/
          if-no-files-found: ignore

  soak:
    name: Idle soak (spec §9)
    if: github.event_name == 'workflow_dispatch' && inputs.soak_hours != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GTK and a headless desktop
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libgtk-3-0t64 libx11-6 libxtst6 x11-utils xvfb openbox at-spi2-core dbus-x11 imagemagick

      - name: Build production binary
        run: go build -tags mygo_noinspector -trimpath -o build/wondervision ./cmd/wondervision

      - name: soak.py
        env:
          SOAK_HOURS: ${{ inputs.soak_hours }}
        run: |
          # shellcheck disable=SC2016 # the inner bash expands $wm, $rc, and the env vars
          xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- bash -c '
            openbox >/dev/null 2>&1 & wm=$!
            for i in $(seq 50); do xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q window && break; sleep 0.1; done
            python3 scripts/soak.py run --out build/verification/soak --hours "$SOAK_HOURS" --interval 300; rc=$?
            kill $wm; exit $rc'

      # Also when the soak is cut short: summarize the samples taken so far
      # into the log and the step summary, which outlive the runner.
      - name: Summarize
        if: always()
        run: |
          test -s build/verification/soak/samples.jsonl || { echo "no samples"; exit 0; }
          python3 scripts/soak.py summarize build/verification/soak
          cat build/verification/soak/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat build/verification/soak/summary.json

      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak
          path: build/verification/soak/
          if-no-files-found: ignore
